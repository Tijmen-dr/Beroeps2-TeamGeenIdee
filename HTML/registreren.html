<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren</title>
    <link rel="stylesheet" href="../CSS/registreren.css">
</head>
<body>
    <header>
        <div class="header">
            <a href="homepage.html">
                <img src="../images/logoPlaceholder.png" alt="websiteLogo">
            </a>
        </div>
    </header>

    <main>
        <form action="action_page.php" id="registrerenForm">
            <h1>Registreren</h1>
            <p>Vul dit formulier in om een account aan te maken.</p>
            <hr>

            <label for="email"><b>E-mailadres</b></label>
            <input type="text" placeholder="Voer e-mailadres in" name="email" id="email" required>

            <label for="psw"><b>Wachtwoord</b></label>
            <input type="password" placeholder="Voer wachtwoord in" name="psw" id="psw" required>

            <label for="psw-repeat"><b>Herhaal wachtwoord</b></label>
            <input type="password" placeholder="Herhaal wachtwoord" name="psw-repeat" id="psw-repeat" required>
            <hr>

            <p class="terms-text">Door een account aan te maken ga je akkoord met onze <a href="#">Voorwaarden & Privacy</a>.</p>
            
            <button type="submit" class="registerbtn">Registreren</button>

            <div class="signin">
                <p>Al een account? <a href="inloggen.html">Inloggen</a>.</p>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer">
            <p>© 2026 Team GeenIdee. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
